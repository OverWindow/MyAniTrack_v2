name: myanitrack_mobile
description: Flutter client for MyAniTrack, an anime watch history and collection analytics app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.9
  dio: ^5.10.0
  fl_chart: ^1.2.0
  flutter_riverpod: ^3.3.2
  google_sign_in: ^7.2.0
  go_router: ^17.3.0
  crop_your_image: ^2.0.0
  image: ^4.5.4
  image_picker: ^1.2.3
  intl: ^0.20.2
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/images/transparent_version.png
    - assets/images/default-profile.jpeg
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
